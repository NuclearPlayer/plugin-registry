name: Backfill plugin sha256

on:
  workflow_dispatch:

jobs:
  backfill:
    name: Backfill sha256 for existing plugins
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Backfill sha256
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: pnpm tsx scripts/backfill-sha256.ts

      - name: Commit and push
        id: commit
        run: |
          git add plugins.json
          git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" && exit 0
          git commit -m "Backfill plugin sha256"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        uses: gacts/purge-jsdelivr-cache@v1
        with:
          url: https://cdn.jsdelivr.net/gh/NuclearPlayer/plugin-registry@master/plugins.json
